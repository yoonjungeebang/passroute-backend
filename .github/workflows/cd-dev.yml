name: CD Dev Workflow

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: ./gradlew bootJar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker image build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    needs: build-and-push-docker-image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_KEY }}
          source: "docker-compose.yml"
          target: "~/"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:develop

            printf '%s\n' \
              "DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:develop" \
              "SPRING_PROFILES_ACTIVE=dev" \
              "SPRING_DATA_REDIS_HOST=redis" \
              "DEV_MYSQL_URL=${{ secrets.DEV_MYSQL_URL }}" \
              "DEV_MYSQL_USER=${{ secrets.DEV_MYSQL_USER }}" \
              "DEV_MYSQL_PASSWORD=${{ secrets.DEV_MYSQL_PASSWORD }}" \
              "AI_SERVER_URL=${{ secrets.AI_SERVER_URL }}" \
              "FRONT_ORIGIN=${{ secrets.FRONT_ORIGIN }}" \
              "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
              "AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}" \
              "AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}" \
              "AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}" \
              "AWS_S3_CLIP_BUCKET=${{ secrets.AWS_S3_CLIP_BUCKET }}" \
              "COOLSMS_API_KEY=${{ secrets.COOLSMS_API_KEY }}" \
              "COOLSMS_API_SECRET=${{ secrets.COOLSMS_API_SECRET }}" \
              "COOLSMS_SENDER=${{ secrets.COOLSMS_SENDER }}" \
              "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" \
              "KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}" \
              "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" \
              "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              "OAUTH2_REDIRECT_URI=${{ secrets.OAUTH2_REDIRECT_URI }}" \
              "HR_MANAGER_SPEAKING_VIDEO_URL=${{ secrets.HR_MANAGER_SPEAKING_VIDEO_URL }}" \
              "HR_MANAGER_SILENCE_VIDEO_URL=${{ secrets.HR_MANAGER_SILENCE_VIDEO_URL }}" \
              "TEAM_LEAD_SPEAKING_VIDEO_URL=${{ secrets.TEAM_LEAD_SPEAKING_VIDEO_URL }}" \
              "TEAM_LEAD_SILENCE_VIDEO_URL=${{ secrets.TEAM_LEAD_SILENCE_VIDEO_URL }}" \
              "EXECUTIVE_SPEAKING_VIDEO_URL=${{ secrets.EXECUTIVE_SPEAKING_VIDEO_URL }}" \
              "EXECUTIVE_SILENCE_VIDEO_URL=${{ secrets.EXECUTIVE_SILENCE_VIDEO_URL }}" \
              "TECH_INTERVIEWER_SPEAKING_VIDEO_URL=${{ secrets.TECH_INTERVIEWER_SPEAKING_VIDEO_URL }}" \
              "TECH_INTERVIEWER_SILENCE_VIDEO_URL=${{ secrets.TECH_INTERVIEWER_SILENCE_VIDEO_URL }}" \
              "MODERATOR_SPEAKING_VIDEO_URL=${{ secrets.MODERATOR_SPEAKING_VIDEO_URL }}" \
              "MODERATOR_SILENCE_VIDEO_URL=${{ secrets.MODERATOR_SILENCE_VIDEO_URL }}" > ~/.env

            cd ~ && docker compose down || true
            docker compose up -d
            docker image prune -f
