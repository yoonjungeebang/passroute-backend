name: CD Dev Workflow

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: ./gradlew bootJar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker image build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    needs: build-and-push-docker-image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_KEY }}
          source: "docker-compose.yml"
          target: "~/"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_KEY }}
          script: |
            # 최신 이미지 pull
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:develop

            # .env 파일 생성
            printf '%s\n' \
              "DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:develop" \
              "SPRING_PROFILES_ACTIVE=dev" \
              "SPRING_DATA_REDIS_HOST=redis" \
              "DEV_MYSQL_URL=${{ secrets.DEV_MYSQL_URL }}" \
              "DEV_MYSQL_USER=${{ secrets.DEV_MYSQL_USER }}" \
              "DEV_MYSQL_PASSWORD=${{ secrets.DEV_MYSQL_PASSWORD }}" \
              "AI_SERVER_URL=${{ secrets.AI_SERVER_URL }}" \
              "FRONT_ORIGIN=${{ secrets.FRONT_ORIGIN }}" \
              "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
              "AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}" \
              "AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}" \
              "AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}" \
              "COOLSMS_API_KEY=${{ secrets.COOLSMS_API_KEY }}" \
              "COOLSMS_API_SECRET=${{ secrets.COOLSMS_API_SECRET }}" \
              "COOLSMS_SENDER=${{ secrets.COOLSMS_SENDER }}" > ~/.env

            # docker compose로 배포
            cd ~ && docker compose down || true
            docker compose up -d

            # 사용하지 않는 이미지 정리
            docker image prune -f