name: CD Dev

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop, main]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download JAR artifact from CI
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker image build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:develop
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:develop-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Sync deploy files via SSM
        run: |
          cat > /tmp/app.env << 'ENVEOF'
          SPRING_PROFILES_ACTIVE=${{ secrets.SPRING_PROFILES_ACTIVE }}
          DEV_DB_URL=${{ secrets.DEV_DB_URL }}
          DEV_DB_USER=${{ secrets.DEV_DB_USER }}
          DEV_DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          FRONT_ORIGIN=${{ secrets.FRONT_ORIGIN }}
          KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          OAUTH2_REDIRECT_URI=${{ secrets.OAUTH2_REDIRECT_URI }}
          AI_SERVER_URL=${{ secrets.AI_SERVER_URL }}
          AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_CLIP_BUCKET=${{ secrets.AWS_S3_CLIP_BUCKET }}
          COOLSMS_API_KEY=${{ secrets.COOLSMS_API_KEY }}
          COOLSMS_API_SECRET=${{ secrets.COOLSMS_API_SECRET }}
          COOLSMS_SENDER=${{ secrets.COOLSMS_SENDER }}
          HR_MANAGER_SPEAKING_VIDEO_URL=${{ secrets.HR_MANAGER_SPEAKING_VIDEO_URL }}
          HR_MANAGER_SILENCE_VIDEO_URL=${{ secrets.HR_MANAGER_SILENCE_VIDEO_URL }}
          TEAM_LEAD_SPEAKING_VIDEO_URL=${{ secrets.TEAM_LEAD_SPEAKING_VIDEO_URL }}
          TEAM_LEAD_SILENCE_VIDEO_URL=${{ secrets.TEAM_LEAD_SILENCE_VIDEO_URL }}
          EXECUTIVE_SPEAKING_VIDEO_URL=${{ secrets.EXECUTIVE_SPEAKING_VIDEO_URL }}
          EXECUTIVE_SILENCE_VIDEO_URL=${{ secrets.EXECUTIVE_SILENCE_VIDEO_URL }}
          TECH_INTERVIEWER_SPEAKING_VIDEO_URL=${{ secrets.TECH_INTERVIEWER_SPEAKING_VIDEO_URL }}
          TECH_INTERVIEWER_SILENCE_VIDEO_URL=${{ secrets.TECH_INTERVIEWER_SILENCE_VIDEO_URL }}
          MODERATOR_SPEAKING_VIDEO_URL=${{ secrets.MODERATOR_SPEAKING_VIDEO_URL }}
          MODERATOR_SILENCE_VIDEO_URL=${{ secrets.MODERATOR_SILENCE_VIDEO_URL }}
          DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:develop-${{ github.event.workflow_run.head_sha }}
          ENVEOF
          sed -i 's/^ *//' /tmp/app.env

          COMPOSE_B64=$(base64 -w0 < docker-compose.yml)
          DEPLOY_B64=$(base64 -w0 < scripts/deploy.sh)
          ROLLBACK_B64=$(base64 -w0 < scripts/rollback.sh)
          NGINX_B64=$(base64 -w0 < nginx/nginx.conf)
          ENV_B64=$(base64 -w0 < /tmp/app.env)

          jq -n \
            --arg inst "${{ secrets.DEV_EC2_INSTANCE_ID }}" \
            --arg c1 "echo $COMPOSE_B64 | base64 -d > /home/ubuntu/docker-compose.yml" \
            --arg c2 "echo $DEPLOY_B64 | base64 -d > /home/ubuntu/deploy.sh && chmod +x /home/ubuntu/deploy.sh" \
            --arg c3 "mkdir -p /home/ubuntu/nginx" \
            --arg c4 "echo $NGINX_B64 | base64 -d > /home/ubuntu/nginx/nginx.conf" \
            --arg c5 "echo $ROLLBACK_B64 | base64 -d > /home/ubuntu/rollback.sh && chmod +x /home/ubuntu/rollback.sh" \
            --arg c6 "echo $ENV_B64 | base64 -d > /home/ubuntu/.env" \
            '{
              InstanceIds: [$inst],
              DocumentName: "AWS-RunShellScript",
              Comment: "Sync deploy files",
              TimeoutSeconds: 30,
              Parameters: { commands: [$c1, $c2, $c3, $c4, $c5, $c6] }
            }' > /tmp/ssm-sync.json

          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file:///tmp/ssm-sync.json \
            --query 'Command.CommandId' --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.DEV_EC2_INSTANCE_ID }}"

          SYNC_STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.DEV_EC2_INSTANCE_ID }}" \
            --query 'Status' --output text)

          if [ "$SYNC_STATUS" != "Success" ]; then
            echo "::error::배포 파일 동기화 실패: $SYNC_STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.DEV_EC2_INSTANCE_ID }}" \
              --query 'StandardErrorContent' --output text
            exit 1
          fi

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.DEV_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Blue-Green Deploy passroute-dev" \
            --timeout-seconds 240 \
            --parameters 'commands=[
              "cd /home/ubuntu && exec bash deploy.sh ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:develop-${{ github.event.workflow_run.head_sha }}"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.DEV_EC2_INSTANCE_ID }}" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")

            if [ "$STATUS" = "Success" ]; then
              echo "배포 성공"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "::error::Deployment failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.DEV_EC2_INSTANCE_ID }}" \
                --query 'StandardErrorContent' --output text
              exit 1
            fi

            echo "배포 진행 중... ($i/60)"
            sleep 5
          done

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deployment timed out"
            exit 1
          fi

      - name: CD Success Notification
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          title: ✅ 개발 환경 배포 성공 ✅
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          color: 0x00FF00
          username: PassRoute Bot

      - name: CD Failure Notification
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          title: ❗️ 개발 환경 배포 실패 ❗️
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          color: 0xFF0000
          username: PassRoute Bot