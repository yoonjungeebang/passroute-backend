name: CD Dev

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop, main]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    env:
      DOCKERHUB_USERNAME: "${{ secrets.DOCKERHUB_USERNAME }}"
      DOCKERHUB_PASSWORD: "${{ secrets.DOCKERHUB_PASSWORD }}"
      DOCKER_IMAGE_NAME: "${{ secrets.DOCKER_IMAGE_NAME }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download JAR artifact from CI
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Docker image build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:develop
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:develop-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: "${{ secrets.DOCKERHUB_USERNAME }}"
      DOCKERHUB_PASSWORD: "${{ secrets.DOCKERHUB_PASSWORD }}"
      DOCKER_IMAGE_NAME: "${{ secrets.DOCKER_IMAGE_NAME }}"
      DEV_EC2_INSTANCE_ID: "${{ secrets.DEV_EC2_INSTANCE_ID }}"
      AWS_ROLE_ARN: "${{ secrets.AWS_ROLE_ARN }}"
      SPRING_PROFILES_ACTIVE: "${{ secrets.SPRING_PROFILES_ACTIVE }}"
      DEV_DB_URL: "${{ secrets.DEV_DB_URL }}"
      DEV_DB_USER: "${{ secrets.DEV_DB_USER }}"
      DEV_DB_PASSWORD: "${{ secrets.DEV_DB_PASSWORD }}"
      JWT_SECRET: "${{ secrets.JWT_SECRET }}"
      FRONT_ORIGIN: "${{ secrets.FRONT_ORIGIN }}"
      KAKAO_CLIENT_ID: "${{ secrets.KAKAO_CLIENT_ID }}"
      KAKAO_CLIENT_SECRET: "${{ secrets.KAKAO_CLIENT_SECRET }}"
      GOOGLE_CLIENT_ID: "${{ secrets.GOOGLE_CLIENT_ID }}"
      GOOGLE_CLIENT_SECRET: "${{ secrets.GOOGLE_CLIENT_SECRET }}"
      OAUTH2_REDIRECT_URI: "${{ secrets.OAUTH2_REDIRECT_URI }}"
      AI_SERVER_URL: "${{ secrets.AI_SERVER_URL }}"
      AWS_S3_BUCKET: "${{ secrets.AWS_S3_BUCKET }}"
      AWS_S3_CLIP_BUCKET: "${{ secrets.AWS_S3_CLIP_BUCKET }}"
      COOLSMS_API_KEY: "${{ secrets.COOLSMS_API_KEY }}"
      COOLSMS_API_SECRET: "${{ secrets.COOLSMS_API_SECRET }}"
      COOLSMS_SENDER: "${{ secrets.COOLSMS_SENDER }}"
      HR_MANAGER_SPEAKING_VIDEO_URL: "${{ secrets.HR_MANAGER_SPEAKING_VIDEO_URL }}"
      HR_MANAGER_SILENCE_VIDEO_URL: "${{ secrets.HR_MANAGER_SILENCE_VIDEO_URL }}"
      TEAM_LEAD_SPEAKING_VIDEO_URL: "${{ secrets.TEAM_LEAD_SPEAKING_VIDEO_URL }}"
      TEAM_LEAD_SILENCE_VIDEO_URL: "${{ secrets.TEAM_LEAD_SILENCE_VIDEO_URL }}"
      EXECUTIVE_SPEAKING_VIDEO_URL: "${{ secrets.EXECUTIVE_SPEAKING_VIDEO_URL }}"
      EXECUTIVE_SILENCE_VIDEO_URL: "${{ secrets.EXECUTIVE_SILENCE_VIDEO_URL }}"
      TECH_INTERVIEWER_SPEAKING_VIDEO_URL: "${{ secrets.TECH_INTERVIEWER_SPEAKING_VIDEO_URL }}"
      TECH_INTERVIEWER_SILENCE_VIDEO_URL: "${{ secrets.TECH_INTERVIEWER_SILENCE_VIDEO_URL }}"
      MODERATOR_SPEAKING_VIDEO_URL: "${{ secrets.MODERATOR_SPEAKING_VIDEO_URL }}"
      MODERATOR_SILENCE_VIDEO_URL: "${{ secrets.MODERATOR_SILENCE_VIDEO_URL }}"
      CRAWLER_WS_ENDPOINT: "${{ secrets.CRAWLER_WS_ENDPOINT }}"
      CRAWLER_API_KEY: "${{ secrets.CRAWLER_API_KEY }}"
      DISCORD_WEBHOOK_URL: "${{ secrets.DISCORD_WEBHOOK_URL }}"

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: "${{ env.AWS_ROLE_ARN }}"
          aws-region: ap-northeast-2

      - name: Docker login on EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$DEV_EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Docker login" \
            --timeout-seconds 30 \
            --parameters "commands=[\"docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD\"]" \
            --query 'Command.CommandId' --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$DEV_EC2_INSTANCE_ID"

      - name: Sync env file via SSM
        run: |
          cat > /tmp/app.env << ENVEOF
          SPRING_PROFILES_ACTIVE=$SPRING_PROFILES_ACTIVE
          DEV_DB_URL=$DEV_DB_URL
          DEV_DB_USER=$DEV_DB_USER
          DEV_DB_PASSWORD=$DEV_DB_PASSWORD
          JWT_SECRET=$JWT_SECRET
          FRONT_ORIGIN=$FRONT_ORIGIN
          KAKAO_CLIENT_ID=$KAKAO_CLIENT_ID
          KAKAO_CLIENT_SECRET=$KAKAO_CLIENT_SECRET
          GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
          GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
          OAUTH2_REDIRECT_URI=$OAUTH2_REDIRECT_URI
          AI_SERVER_URL=$AI_SERVER_URL
          AWS_S3_BUCKET=$AWS_S3_BUCKET
          AWS_S3_CLIP_BUCKET=$AWS_S3_CLIP_BUCKET
          COOLSMS_API_KEY=$COOLSMS_API_KEY
          COOLSMS_API_SECRET=$COOLSMS_API_SECRET
          COOLSMS_SENDER=$COOLSMS_SENDER
          HR_MANAGER_SPEAKING_VIDEO_URL=$HR_MANAGER_SPEAKING_VIDEO_URL
          HR_MANAGER_SILENCE_VIDEO_URL=$HR_MANAGER_SILENCE_VIDEO_URL
          TEAM_LEAD_SPEAKING_VIDEO_URL=$TEAM_LEAD_SPEAKING_VIDEO_URL
          TEAM_LEAD_SILENCE_VIDEO_URL=$TEAM_LEAD_SILENCE_VIDEO_URL
          EXECUTIVE_SPEAKING_VIDEO_URL=$EXECUTIVE_SPEAKING_VIDEO_URL
          EXECUTIVE_SILENCE_VIDEO_URL=$EXECUTIVE_SILENCE_VIDEO_URL
          TECH_INTERVIEWER_SPEAKING_VIDEO_URL=$TECH_INTERVIEWER_SPEAKING_VIDEO_URL
          TECH_INTERVIEWER_SILENCE_VIDEO_URL=$TECH_INTERVIEWER_SILENCE_VIDEO_URL
          MODERATOR_SPEAKING_VIDEO_URL=$MODERATOR_SPEAKING_VIDEO_URL
          MODERATOR_SILENCE_VIDEO_URL=$MODERATOR_SILENCE_VIDEO_URL
          CRAWLER_WS_ENDPOINT=$CRAWLER_WS_ENDPOINT
          CRAWLER_API_KEY=$CRAWLER_API_KEY
          ENVEOF
          sed -i 's/^ *//' /tmp/app.env

          ENV_B64=$(base64 -w0 < /tmp/app.env)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$DEV_EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Sync env file" \
            --timeout-seconds 30 \
            --parameters "commands=[\"echo $ENV_B64 | base64 -d > /home/ubuntu/.env\"]" \
            --query 'Command.CommandId' --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$DEV_EC2_INSTANCE_ID"

          SYNC_STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$DEV_EC2_INSTANCE_ID" \
            --query 'Status' --output text)

          if [ "$SYNC_STATUS" != "Success" ]; then
            echo "::error::env 파일 동기화 실패: $SYNC_STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$DEV_EC2_INSTANCE_ID" \
              --query 'StandardErrorContent' --output text
            exit 1
          fi

      - name: Deploy via SSM
        run: |
          DOCKER_IMAGE="$DOCKERHUB_USERNAME/$DOCKER_IMAGE_NAME:develop-${{ github.event.workflow_run.head_sha }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$DEV_EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy passroute-dev" \
            --timeout-seconds 120 \
            --parameters "commands=[
              \"docker stop passroute-blue passroute-green passroute-nginx 2>/dev/null || true\",
              \"docker rm passroute-blue passroute-green passroute-nginx 2>/dev/null || true\",
              \"docker pull $DOCKER_IMAGE\",
              \"docker stop passroute-app 2>/dev/null || true\",
              \"docker rm passroute-app 2>/dev/null || true\",
              \"docker network create passroute-net 2>/dev/null || true\",
              \"docker network connect passroute-net passroute-redis 2>/dev/null || true\",
              \"docker start passroute-redis 2>/dev/null || docker run -d --name passroute-redis --network passroute-net --restart unless-stopped redis:7-alpine\",
              \"docker run -d --name passroute-app --network passroute-net -p 8080:8080 --env-file /home/ubuntu/.env --restart unless-stopped $DOCKER_IMAGE\",
              \"sleep 10\",
              \"docker inspect -f '{{.State.Running}}' passroute-app | grep -q true && echo 'Health check passed' || (echo '::error::App container not running' && exit 1)\",
              \"docker image prune -f\"
            ]" \
            --query 'Command.CommandId' \
            --output text)

          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$DEV_EC2_INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")

            if [ "$STATUS" = "Success" ]; then
              echo "배포 성공"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "::error::Deployment failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$DEV_EC2_INSTANCE_ID" \
                --query 'StandardErrorContent' --output text
              exit 1
            fi

            echo "배포 진행 중... ($i/40)"
            sleep 5
          done

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deployment timed out"
            exit 1
          fi

      - name: CD Success Notification
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          title: ✅ 개발 환경 배포 성공 ✅
          webhook: "${{ env.DISCORD_WEBHOOK_URL }}"
          color: 0x00FF00
          username: PassRoute Bot

      - name: CD Failure Notification
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          title: ❗️ 개발 환경 배포 실패 ❗️
          webhook: "${{ env.DISCORD_WEBHOOK_URL }}"
          color: 0xFF0000
          username: PassRoute Bot