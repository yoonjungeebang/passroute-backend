spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DEV_DB_URL}
    username: ${DEV_DB_USER}
    password: ${DEV_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    open-in-view: false

cors:
  allowed-origins:
    - ${FRONT_ORIGIN}

logging:
  level:
    root: info

swagger:
  server-url:
    local: ${SWAGGER_LOCAL_URL:http://localhost:8080/api}
    prod: ${SWAGGER_PROD_URL:https://pass-route.com/api}

sms:
  coolsms:
    api-key: ${COOLSMS_API_KEY}
    api-secret: ${COOLSMS_API_SECRET}
    sender: ${COOLSMS_SENDER}
