topics:

  # ═══════════════════════════════════════════════════════════════
  # AI 윤리 (AI_ETHICS) — 10개
  # ═══════════════════════════════════════════════════════════════

  - id: topic_001_ai_replaces_junior
    title: 생성형 AI가 주니어 개발자 일자리를 위협하는가
    description: ChatGPT·Copilot 등 코드 생성 AI의 보편화가 주니어 채용·성장에 미치는 영향
    category: AI_ETHICS
    proKeyPoints:
      - 단순 반복 코딩 자동화로 주니어 수요 축소
      - 신입이 실무 학습할 기회 자체가 줄어듦
      - 시니어 위주 채용 트렌드가 데이터로 확인됨
      - 부트캠프·신입 입사자 증가율 둔화
    conKeyPoints:
      - AI는 도구이며 판단·설계·검증은 인간 몫
      - AI 활용 능력이 새로운 주니어 역량으로 부상
      - 생산성 향상이 더 많은 프로젝트와 채용을 만듦
      - 멘토링·코드 리뷰는 여전히 사람의 영역

  - id: topic_002_ai_in_interview
    title: 기술 면접에서 AI 코딩 도구 사용을 허용해야 하는가
    description: 실무에선 AI를 쓰면서 면접에선 금지하는 관행의 적절성
    category: AI_ETHICS
    proKeyPoints:
      - 실무 환경 그대로 평가하는 것이 합리적
      - AI 활용 능력도 중요한 채용 변별 요소
      - 단순 암기보다 문제 해결 능력 측정 가능
    conKeyPoints:
      - 지원자의 순수 사고력·기초 이해 평가 불가
      - AI 의존도가 후보 간 편차를 왜곡
      - 알고리즘·시스템 설계 같은 본질 역량 검증 어려움
      - AI 답을 비판적으로 평가하는 능력은 기초가 있어야 가능

  - id: topic_003_ai_code_copyright
    title: AI가 생성한 코드의 저작권은 사용자에게 있는가
    description: AI 어시스턴트가 작성한 코드의 라이선스·저작권 귀속 문제
    category: AI_ETHICS
    proKeyPoints:
      - 프롬프트 설계와 검수는 사용자의 창작 행위
      - 도구 사용 결과물은 사용자 소유가 일반 원칙
      - 책임도 사용자가 지므로 권리도 사용자에 귀속
    conKeyPoints:
      - 학습 데이터의 원저작자 권리 침해 가능
      - 단순 프롬프트 입력은 창작으로 보기 어려움
      - GPL 등 오픈소스 라이선스 오염 리스크
      - 법·판례가 아직 명확하지 않은 영역

  - id: topic_004_ai_monitoring
    title: 회사가 직원의 AI 사용 내역을 모니터링해도 되는가
    description: 보안·생산성 측정을 위한 AI 사용 로깅의 정당성
    category: AI_ETHICS
    proKeyPoints:
      - 기밀 코드·고객 데이터 유출 방지 목적
      - 라이선스 위반 코드 유입 차단
      - 생산성 측정과 베스트 프랙티스 공유에 활용
    conKeyPoints:
      - 개발자 프라이버시 침해
      - 감시 분위기가 창의성·시도를 위축
      - 데이터 자체보다 결과물 검수가 더 효과적
      - 노동조합·근로기준법과 충돌 가능

  - id: topic_005_ai_interviewer
    title: AI 면접관이 1차 통과 결정을 내려도 되는가
    description: AI 자동 평가가 합격 여부를 결정하는 방식의 적절성
    category: AI_ETHICS
    proKeyPoints:
      - 사람보다 편향(성별·출신 등) 적게 평가 가능
      - 대량 지원자 빠르게 스크리닝
      - 평가 기준 일관성 유지
    conKeyPoints:
      - AI 학습 데이터 자체에 편향 내재
      - 비언어적 신호·잠재력 평가 불가
      - 부적격 판정의 책임 소재 모호
      - 지원자가 결과를 납득·이의제기하기 어려움

  - id: topic_006_ai_training_data
    title: AI 학습용 코드 크롤링에 원저작자 동의가 필수인가
    description: 공개된 오픈소스 코드를 AI 학습에 사용하는 행위의 정당성
    category: AI_ETHICS
    proKeyPoints:
      - 라이선스(GPL 등)는 학습 사용까지 허용하지 않음
      - 원저작자 의도와 다른 상업적 활용
      - 동의 없는 사용은 디지털 강탈
    conKeyPoints:
      - 공개된 코드는 학습 목적 사용 묵시적 허용
      - 학습 결과물이 원본과 다르면 변형 저작물
      - 동의 절차 비용이 기술 발전을 지연시킴
      - 인간도 같은 방식으로 코드를 보며 학습

  - id: topic_007_ai_weakens_problem_solving
    title: AI 어시스턴트 의존이 개발자의 문제 해결력을 약화시키는가
    description: 코드 생성 도구가 개발자 본연의 사고 능력에 미치는 영향
    category: AI_ETHICS
    proKeyPoints:
      - 디버깅·트레이싱 같은 기초 역량 저하
      - "왜 이 코드인지" 모르고 복붙하는 사례 증가
      - 시스템 설계·아키텍처 사고 기회 감소
    conKeyPoints:
      - 단순 반복 작업 시간 절약 → 고차원 문제에 집중
      - 새로운 패턴·라이브러리 학습 가속
      - 도구 활용 능력도 핵심 역량의 일부
      - 잘 쓰는 개발자가 더 빠르게 성장

  - id: topic_008_ai_in_secure_code
    title: 보안이 중요한 코드에 AI 어시스턴트 사용을 금지해야 하는가
    description: 금융·의료·국방 등 민감 영역에서 AI 코드 생성의 위험성
    category: AI_ETHICS
    proKeyPoints:
      - 학습 데이터에 알려진 취약 패턴 포함
      - 미묘한 보안 결함 검수 어려움
      - 책임 추적·감사(audit) 흐름 복잡
    conKeyPoints:
      - 보안 검수 도구와 병행하면 오히려 더 안전
      - 보일러플레이트 생성 시간 단축으로 검토에 집중 가능
      - 금지는 개발 속도와 인재 유치에 불이익
      - AI 자체보다 검수 프로세스가 더 중요

  - id: topic_009_ai_output_responsibility
    title: AI 결과물의 모든 책임은 사용한 개발자가 져야 하는가
    description: AI 생성 코드로 발생한 장애·보안 사고의 책임 소재
    category: AI_ETHICS
    proKeyPoints:
      - 최종 코드를 머지한 사람이 책임지는 게 원칙
      - AI 결과를 검수할 의무는 사용자에게 있음
      - 책임 분산은 안전망을 약화시킴
    conKeyPoints:
      - 도구 제공자도 일정 책임 분담 필요 (제조물 책임)
      - 모든 결과를 100% 검수하는 것은 비현실적
      - 학습 데이터 편향·결함은 사용자 통제 밖
      - 회사 차원의 정책·가드레일이 함께 작동해야 공정

  - id: topic_010_ai_skill_in_evaluation
    title: 회사가 직원의 AI 활용 능력으로 인사 평가를 해도 되는가
    description: AI 사용 숙련도를 핵심 역량으로 인정해 평가 지표로 활용하는 것
    category: AI_ETHICS
    proKeyPoints:
      - 시대 변화에 맞는 새로운 핵심 역량
      - 정량 측정 가능 (생산성·코드 품질 향상치)
      - 회사 경쟁력에 직결되는 능력
    conKeyPoints:
      - 도구 숙련도와 본질적 개발 역량 혼동
      - AI를 안 쓰고도 좋은 결과 내는 개발자 평가절하
      - 직무 특성에 따라 AI 활용 빈도가 다름
      - 단기 트렌드를 영구 평가 기준으로 굳히는 위험

  # ═══════════════════════════════════════════════════════════════
  # 채용 (RECRUITMENT) — 10개
  # ═══════════════════════════════════════════════════════════════

  - id: topic_011_opensource_contribution
    title: 오픈소스 기여를 채용 평가에 반영해야 하는가
    description: GitHub·오픈소스 활동을 정량 지표로 활용하는 것의 타당성
    category: RECRUITMENT
    proKeyPoints:
      - 실제 코드 품질과 협업 능력 검증 가능
      - 자기주도 학습 의지 확인
      - 정량적이고 위·변조 어려운 평가 자료
    conKeyPoints:
      - 시간 여유 있는 지원자에게만 유리해 불평등 심화
      - 회사 업무와 다른 분야에서의 기여는 변별력 낮음
      - 활동량이 곧 실력을 보장하지 않음
      - 회사 내부 비공개 프로젝트 종사자에 불리

  - id: topic_012_nondev_preference
    title: 비전공자 부트캠프 출신을 신입 개발자로 우대해야 하는가
    description: 다양한 배경 vs 전공자 기초 깊이 사이의 채용 전략
    category: RECRUITMENT
    proKeyPoints:
      - 다양한 도메인 지식이 팀 시너지 창출
      - 사용자·비즈니스 이해도 우위
      - 학습 적응력을 이미 증명한 인재
    conKeyPoints:
      - CS 기초(자료구조·OS·네트워크) 깊이 부족
      - 장기적 성장 한계와 천장 우려
      - 회사가 추가 교육 비용 부담
      - 짧은 부트캠프로 4년 학위 대체 어려움

  - id: topic_013_degree_in_hiring
    title: 학력은 개발자 채용에서 의미 있는 지표인가
    description: 출신 대학·학위가 신입 개발자 채용에 미치는 영향의 적절성
    category: RECRUITMENT
    proKeyPoints:
      - CS 학위는 기초 이론 학습의 객관적 증명
      - 장기 학습 능력의 신호로 작용
      - 대량 지원자 1차 스크리닝에 효율적
    conKeyPoints:
      - 실무 능력과 학력의 상관관계 약함
      - 비전공자·독학 인재 진입 장벽
      - 변화 빠른 IT 산업에 4년 전 지식은 의미 제한적
      - 차별 요소로 작용해 다양성 저해

  - id: topic_014_coding_test_validity
    title: 코딩 테스트 점수는 실무 능력을 잘 반영하는가
    description: 알고리즘 PS 위주 코딩 테스트가 채용 변별에 적합한지
    category: RECRUITMENT
    proKeyPoints:
      - 기초 사고력과 알고리즘 이해도 측정 가능
      - 대량 지원자 빠르게 스크리닝
      - 객관적·정량적 비교 가능
    conKeyPoints:
      - 실무 코드는 협업·설계·디버깅 비중이 더 큼
      - 단기 트레이닝으로 점수 끌어올리기 가능
      - 백엔드·프론트·DevOps 직무별 필요 역량이 다름
      - 시간 제약 푸는 능력이 실무 생산성과 무관

  - id: topic_015_side_project_credit
    title: 야간·주말 사이드 프로젝트가 채용 가산점이어야 하는가
    description: 개인 시간 활용한 추가 활동을 평가에 반영하는 것의 적절성
    category: RECRUITMENT
    proKeyPoints:
      - 열정과 자기주도성의 강력한 증거
      - 실무 외 다양한 기술 스택 경험 확인
      - 결과물(서비스·앱)을 직접 검증 가능
    conKeyPoints:
      - 가정·건강 등 개인 사정 있는 지원자에 불리
      - 워라밸 문화와 정면 충돌
      - 본업 외 시간을 강요하는 분위기 조성
      - 회사 시간에 성과를 내는 능력이 더 중요

  - id: topic_016_culture_fit
    title: 면접에서 컬처핏(culture fit) 평가는 정당한가
    description: 기술 역량 외에 조직 적합성을 별도 평가 기준으로 두는 것
    category: RECRUITMENT
    proKeyPoints:
      - 협업 중심 개발에서 팀 케미가 성과에 직결
      - 입사 후 조기 이탈률 감소
      - 조직 문화·미션 이해도가 장기 기여로 이어짐
    conKeyPoints:
      - "비슷한 사람"만 뽑아 다양성 저해
      - 무의식적 편향(성별·나이·출신)이 개입
      - 평가 기준이 모호해 면접관 주관에 좌우
      - 컬처핏 명목으로 부당한 탈락 사유 정당화

  - id: topic_017_algo_for_backend
    title: 알고리즘 PS 능력이 백엔드 개발자에게 필수인가
    description: 실무 백엔드 직무에서 알고리즘 문제 풀이 능력의 중요성
    category: RECRUITMENT
    proKeyPoints:
      - 복잡도 분석은 쿼리·API 설계에 직접 영향
      - 자료구조 이해가 데이터 모델링의 기초
      - 사고력의 객관적 측정 수단
    conKeyPoints:
      - 실제 백엔드 업무는 설계·운영·협업 비중이 큼
      - 라이브러리·프레임워크가 알고리즘 대부분 처리
      - PS 잘하는 사람이 시스템 설계도 잘한다는 보장 없음
      - 트래픽 대응은 알고리즘보다 인프라 지식이 더 결정적

  - id: topic_018_skill_over_personality
    title: 신입 채용에서 실력이 인성보다 우선이어야 하는가
    description: 기술 역량과 협업 태도 사이의 우선순위
    category: RECRUITMENT
    proKeyPoints:
      - 인성은 입사 후 교육·환경으로 변화 가능
      - 실력은 짧은 면접에서 검증해야 하는 핵심
      - 결국 회사는 결과물로 평가받음
    conKeyPoints:
      - 한 명의 부적절한 태도가 팀 전체 생산성 저하
      - 실력은 입사 후에도 성장 가능하지만 인성은 어려움
      - 협업 비중이 높은 개발에서 태도가 결과를 좌우
      - 기술 평가만 보다가 큰 사고 일으킨 사례 다수

  - id: topic_019_reference_check
    title: 평판 조회(reference check)는 채용 과정에 포함되어야 하는가
    description: 전 직장 동료·상사를 통한 평판 검증의 적절성
    category: RECRUITMENT
    proKeyPoints:
      - 짧은 면접으로 알 수 없는 실제 협업 모습 확인
      - 이력서·자기소개서의 검증 수단
      - 부적격자 채용으로 인한 비용 절감
    conKeyPoints:
      - 동의 없는 평판 조회는 사생활 침해
      - 전 직장과의 인간 관계·갈등에 좌우
      - 지원자의 이직 사실을 회사에 노출시킴
      - 평판이 좋아도 새 환경에서 다를 수 있음

  - id: topic_020_salary_transparency
    title: 개발자 연봉 정보 공개는 채용 시장에 긍정적인가
    description: 회사·직급별 연봉 공개가 채용·이직에 미치는 영향
    category: RECRUITMENT
    proKeyPoints:
      - 정보 비대칭 해소로 협상력 균형
      - 부당한 임금 격차(성별·연차) 가시화
