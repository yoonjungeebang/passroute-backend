spring:
  flyway:
    enabled: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  application:
    name: passroute-backend

  profiles:
    active: dev

server:
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

cors:
  allowed-origins:
    - http://localhost:3000

swagger:
  server-url:
    local: http://localhost:8080/api
    prod: https://pass-route.com/api

oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/auth/callback}

follow-up:
  ai-server-url: ${AI_SERVER_URL:http://localhost:8000}
  max-turn: 1
  timeout-seconds: 120

ai:
  debate:
    timeout: 180s

persona-video:
  url-expiration: 6h
  interviewers:
    HR_MANAGER:
      speaking-video-url: ${HR_MANAGER_SPEAKING_VIDEO_URL:}
      silence-video-url: ${HR_MANAGER_SILENCE_VIDEO_URL:}
    TEAM_LEAD:
      speaking-video-url: ${TEAM_LEAD_SPEAKING_VIDEO_URL:}
      silence-video-url: ${TEAM_LEAD_SILENCE_VIDEO_URL:}
    EXECUTIVE:
      speaking-video-url: ${EXECUTIVE_SPEAKING_VIDEO_URL:}
      silence-video-url: ${EXECUTIVE_SILENCE_VIDEO_URL:}
    TECH_INTERVIEWER:
      speaking-video-url: ${TECH_INTERVIEWER_SPEAKING_VIDEO_URL:}
      silence-video-url: ${TECH_INTERVIEWER_SILENCE_VIDEO_URL:}
  moderator:
    speaking-video-url: ${MODERATOR_SPEAKING_VIDEO_URL:}
    silence-video-url: ${MODERATOR_SILENCE_VIDEO_URL:}

cloud:
  aws:
    region:
      static: ap-northeast-2
    s3:
      bucket: ${AWS_S3_BUCKET}
      clip-bucket: ${AWS_S3_CLIP_BUCKET}
