spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USER}
    password: ${PROD_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false
    open-in-view: false

cors:
  allowed-origins:
    - ${FRONT_ORIGIN}

logging:
  level:
    root: info

swagger:
  server-url:
    local: ${SWAGGER_LOCAL_URL:http://localhost:8080/api}
    prod: ${SWAGGER_PROD_URL:https://pass-route.com/api}

sms:
  coolsms:
    api-key: ${COOLSMS_API_KEY}
    api-secret: ${COOLSMS_API_SECRET}
    sender: ${COOLSMS_SENDER}
